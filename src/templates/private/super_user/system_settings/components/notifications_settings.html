<h3 class="st-section-title">Notification Preferences</h3>
<form method="POST" action="{{ url_for('super_user.system_settings') }}" class="st-form">
    <input type="hidden" name="settings_category" value="notifications">

    <div class="st-toggles-grid">
        <div class="st-toggle-item">
            <div class="st-toggle-header">
                <label for="welcome_email" class="st-toggle-label">
                    Send Welcome Email to New Users
                </label>
                <input class="st-toggle" type="checkbox" id="welcome_email" name="welcome_email"
                    checked>
            </div>
            <p class="st-toggle-desc">Automatically send a welcome email when users register</p>
        </div>
        <div class="st-toggle-item">
            <div class="st-toggle-header">
                <label for="password_reset_email" class="st-toggle-label">
                    Send Password Reset Emails
                </label>
                <input class="st-toggle" type="checkbox" id="password_reset_email"
                    name="password_reset_email" checked>
            </div>
            <p class="st-toggle-desc">Enable password reset functionality via email</p>
        </div>
        <div class="st-toggle-item">
            <div class="st-toggle-header">
                <label for="course_enrollment_email" class="st-toggle-label">
                    Send Course Enrollment Confirmations
                </label>
                <input class="st-toggle" type="checkbox" id="course_enrollment_email"
                    name="course_enrollment_email" checked>
            </div>
            <p class="st-toggle-desc">Notify users when they are enrolled in a course</p>
        </div>
        <div class="st-toggle-item">
            <div class="st-toggle-header">
                <label for="admin_notifications" class="st-toggle-label">
                    Send Admin Notifications
                </label>
                <input class="st-toggle" type="checkbox" id="admin_notifications"
                    name="admin_notifications" checked>
            </div>
            <p class="st-toggle-desc">Receive notifications about system events and user actions</p>
        </div>
    </div>

    <button type="submit" class="st-btn st-btn-primary">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="margin-right: 6px;">
            <path d="M12 5C12 3.5 11 2 8 2C5 2 4 3.5 4 5C4 7.5 3 8.5 3 8.5H13C13 8.5 12 7.5 12 5Z"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        Update Notification Settings
    </button>
</form>
