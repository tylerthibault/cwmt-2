<form method="POST" action="{{ url_for('super_user.update_email_settings') }}">
    <div class="row">
        {% for setting in settings %}
        <div class="col-md-6">
            <div class="mb-3">
                <label for="{{ setting.key }}" class="form-label">
                    {{ setting.key.replace('mail_', '').replace('_', ' ').title() }}
                </label>
                {% if setting.is_encrypted %}
                    <input type="password" class="form-control" 
                           id="{{ setting.key }}"
                           name="{{ setting.key }}" 
                           placeholder="Enter new password to change (leave blank to keep current)">
                {% elif setting.key in ['mail_use_tls', 'mail_use_ssl'] %}
                    <select class="form-select" id="{{ setting.key }}" name="{{ setting.key }}">
                        <option value="true" {% if setting.value=='true' %}selected{% endif %}>Enabled</option>
                        <option value="false" {% if setting.value !='true' %}selected{% endif %}>Disabled</option>
                    </select>
                {% else %}
                    <input type="{{ 'number' if setting.key == 'mail_port' else 'text' }}" 
                           class="form-control"
                           id="{{ setting.key }}"
                           name="{{ setting.key }}" 
                           value="{{ setting.value or '' }}"
                           {% if setting.key in ['mail_server', 'mail_username', 'mail_default_sender'] %}required{% endif %}>
                {% endif %}
                {% if setting.description %}
                <small class="form-text text-muted">{{ setting.description }}</small>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
    
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg"></i> Update Email Settings
        </button>
        <button type="button" class="btn btn-success" onclick="testEmail()">
            <i class="bi bi-send-check"></i> Send Test Email
        </button>
    </div>
</form>


<script>
    function testEmail() {
        // Disable button and show loading state
        const btn = event.target;
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';
        
        fetch('/super/settings/email/test', {
            method: 'POST',
            headers: {
                'Accept': 'application/json'
            }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.message) {
                    alert('✓ ' + data.message);
                } else if (data.error) {
                    alert('✗ ' + data.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('✗ Error testing email: ' + error.message);
            })
            .finally(() => {
                // Re-enable button
                btn.disabled = false;
                btn.innerHTML = originalText;
            });
    }
</script>
