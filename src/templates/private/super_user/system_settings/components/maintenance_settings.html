<h3 class="st-section-title">Maintenance & System Control</h3>
<form method="POST" action="{{ url_for('super_user.system_settings') }}" class="st-form">
    <input type="hidden" name="settings_category" value="maintenance">

    <div class="st-toggles-grid">
        <div class="st-toggle-item st-toggle-warning">
            <div class="st-toggle-header">
                <label for="maintenance_mode" class="st-toggle-label">
                    <strong>Enable Maintenance Mode</strong>
                </label>
                <input class="st-toggle" type="checkbox" id="maintenance_mode"
                    name="maintenance_mode">
            </div>
            <p class="st-toggle-desc">Blocks access for all users except super users</p>
        </div>
        <div class="st-toggle-item">
            <div class="st-toggle-header">
                <label for="registration_enabled" class="st-toggle-label">
                    Allow New User Registration
                </label>
                <input class="st-toggle" type="checkbox" id="registration_enabled"
                    name="registration_enabled" checked>
            </div>
            <p class="st-toggle-desc">Enable or disable new user sign-ups</p>
        </div>
    </div>

    <div class="st-form-group">
        <label for="maintenance_message" class="st-label">Maintenance Message</label>
        <textarea class="st-textarea" id="maintenance_message" name="maintenance_message" rows="3"
            placeholder="Enter a message to display to users during maintenance">We are currently performing scheduled maintenance. Please check back later.</textarea>
    </div>

    <button type="submit" class="st-btn st-btn-warning">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="margin-right: 6px;">
            <path
                d="M13 6.5L9.5 3L10.5 2C10.776 1.724 11.224 1.724 11.5 2L14 4.5C14.276 4.776 14.276 5.224 14 5.5L13 6.5Z"
                stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M13 6.5L6 13.5H3V10.5L10 3.5M5.5 13.5H13.5" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Update Maintenance Settings
    </button>
</form>
