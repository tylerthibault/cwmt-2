<!-- Student Calendar Component - Uses Base Calendar -->

<!-- Include the base calendar -->
{% include 'components/calendar_base.html' %}

<!-- Student-specific enrollment modal styles -->
<style>
    .enrollment-modal {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 1rem;
    }

    .enrollment-modal.active {
        display: flex;
    }

    .enrollment-modal-content {
        background: white;
        border-radius: var(--radius-lg);
        max-width: 500px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: var(--shadow-xl);
    }

    .enrollment-modal-header {
        padding: 1.5rem;
        border-bottom: 1px solid var(--gray-200);
    }

    .enrollment-modal-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--gray-900);
        margin: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .enrollment-modal-title svg {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        color: var(--primary-color);
    }

    .enrollment-modal-body {
        padding: 1.5rem;
    }

    .course-info-item {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 0.75rem;
        background: var(--gray-50);
        border-radius: var(--radius-md);
        margin-bottom: 0.75rem;
    }

    .course-info-item svg {
        width: 20px;
        height: 20px;
        color: var(--primary-color);
        flex-shrink: 0;
        margin-top: 2px;
    }

    .course-info-content {
        flex: 1;
    }

    .course-info-label {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--gray-600);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 0.25rem;
    }

    .course-info-value {
        font-size: 0.95rem;
        color: var(--gray-900);
        font-weight: 500;
    }

    .enrollment-progress {
        margin-top: 1rem;
        padding: 1rem;
        background: var(--gray-50);
        border-radius: var(--radius-md);
        border-left: 3px solid var(--primary-color);
    }

    .progress-label {
        font-size: 0.875rem;
        color: var(--gray-700);
        margin-bottom: 0.5rem;
        font-weight: 500;
    }

    .progress-bar-container {
        background: var(--gray-200);
        height: 8px;
        border-radius: var(--radius-full);
        overflow: hidden;
    }

    .progress-bar-fill {
        height: 100%;
        background: var(--primary-gradient);
        transition: width 0.3s ease;
    }

    .enrollment-modal-footer {
        padding: 1.5rem;
        border-top: 1px solid var(--gray-200);
        display: flex;
        gap: 0.75rem;
        justify-content: flex-end;
    }

    .btn-modal {
        padding: 0.75rem 1.5rem;
        border-radius: var(--radius-md);
        font-weight: 600;
        font-size: 0.95rem;
        border: none;
        cursor: pointer;
        transition: all var(--transition-smooth);
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .btn-modal-secondary {
        background: var(--gray-200);
        color: var(--gray-700);
    }

    .btn-modal-secondary:hover {
        background: var(--gray-300);
    }

    .btn-modal-primary {
        background: var(--primary-gradient);
        color: white;
    }

    .btn-modal-primary:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
    }

    .btn-modal svg {
        width: 18px;
        height: 18px;
    }

    .enrollment-status-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        border-radius: var(--radius-full);
        font-size: 0.875rem;
        font-weight: 600;
        margin-bottom: 1rem;
    }

    .badge-already-enrolled {
        background: rgba(34, 197, 94, 0.1);
        color: var(--success-color);
    }

    .badge-course-full {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger-color);
    }

    @media (max-width: 480px) {
        .enrollment-modal-content {
            max-width: 100%;
            margin: 0.5rem;
        }

        .enrollment-modal-footer {
            flex-direction: column;
        }

        .btn-modal {
            width: 100%;
            justify-content: center;
        }
    }
</style>

<!-- Student-specific enrollment JavaScript -->
<script>
    // Override the day click handler for student enrollment
    function handleDayWithEvents(date, events) {
        const event = events[0];
        showEnrollmentModal(event);
    }

    function handleEmptyDay(date) {
        // Students can't create courses, so do nothing
        return;
    }

    function showEnrollmentModal(course) {
        const isPast = new Date(course.start_date) < new Date();
        const isEnrolled = course.is_enrolled;
        const isFull = course.current_enrollment >= course.max_students;

        let modalContent = `
            <div class="enrollment-modal-header">
                <h3 class="enrollment-modal-title">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                    ${course.name}
                </h3>
            </div>
            <div class="enrollment-modal-body">
        `;

        // Show status badges
        if (isEnrolled) {
            modalContent += `
                <div class="enrollment-status-badge badge-already-enrolled">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    You're already enrolled in this course
                </div>
            `;
        } else if (isFull) {
            modalContent += `
                <div class="enrollment-status-badge badge-course-full">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    This course is currently full
                </div>
            `;
        }

        // Course details
        modalContent += `
            <div class="course-info-item">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <div class="course-info-content">
                    <div class="course-info-label">Date</div>
                    <div class="course-info-value">${new Date(course.start_date).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>
                </div>
            </div>
            <div class="course-info-item">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <div class="course-info-content">
                    <div class="course-info-label">Time</div>
                    <div class="course-info-value">${course.start_time} - ${course.end_time}</div>
                </div>
            </div>
            <div class="course-info-item">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                <div class="course-info-content">
                    <div class="course-info-label">Location</div>
                    <div class="course-info-value">${course.location}</div>
                </div>
            </div>
            <div class="course-info-item">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
                <div class="course-info-content">
                    <div class="course-info-label">Enrollment</div>
                    <div class="course-info-value">${course.current_enrollment} / ${course.max_students} students</div>
                </div>
            </div>
        `;

        // Show enrollment progress bar if not full
        if (!isEnrolled && !isFull) {
            const progressPercent = (course.current_enrollment / course.max_students) * 100;
            modalContent += `
                <div class="enrollment-progress">
                    <div class="progress-label">Spots Available: ${course.max_students - course.current_enrollment} remaining</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" style="width: ${progressPercent}%"></div>
                    </div>
                </div>
            `;
        }

        modalContent += `</div>`;

        // Footer with action buttons
        modalContent += `<div class="enrollment-modal-footer">`;
        modalContent += `
            <button class="btn-modal btn-modal-secondary" onclick="closeEnrollmentModal()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
                Close
            </button>
        `;

        // Show enroll button if conditions are met
        if (!isPast && !isEnrolled && !isFull) {
            modalContent += `
                <a href="/student/checkout/${course.id}" class="btn-modal btn-modal-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Enroll Now
                </a>
            `;
        } else if (isEnrolled) {
            modalContent += `
                <a href="${window.location.origin}/student/my-enrollments" class="btn-modal btn-modal-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                    </svg>
                    View My Enrollments
                </a>
            `;
        }

        modalContent += `</div>`;

        // Create and show modal
        const modal = document.createElement('div');
        modal.className = 'enrollment-modal active';
        modal.innerHTML = `<div class="enrollment-modal-content">${modalContent}</div>`;
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeEnrollmentModal();
            }
        });
        document.body.appendChild(modal);
        
        // Store reference for closing
        window.currentEnrollmentModal = modal;
    }

    function closeEnrollmentModal() {
        if (window.currentEnrollmentModal) {
            window.currentEnrollmentModal.remove();
            window.currentEnrollmentModal = null;
        }
    }

    // Close modal on escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeEnrollmentModal();
        }
    });
</script>
