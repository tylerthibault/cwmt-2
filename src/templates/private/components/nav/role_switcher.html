<div class="role-switcher">
    {% set user_roles = current_user.get_roles() %}
    {% if user_roles|length > 1 %}
    <div class="role-switcher-card">
        <div class="role-switcher-header">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="17 1 21 5 17 9"/>
                <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                <polyline points="7 23 3 19 7 15"/>
                <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
            <span class="role-switcher-label">Switch Role</span>
        </div>
        
        <form method="POST" id="roleSwitchForm" class="role-switcher-form">
            <div class="role-select-wrapper">
                <select class="role-select" id="roleSelect" name="role" onchange="this.form.submit()">
                    {% set active_role = session.get('active_role', 'student') %}
                    {% for role in user_roles %}
                    <option value="{{ role }}" {% if role == active_role %}selected{% endif %}>
                        {% if role == 'superuser' %}
                            Superuser
                        {% elif role == 'admin' %}
                            Admin
                        {% elif role == 'instructor' %}
                            Instructor
                        {% elif role == 'student' %}
                            Student
                        {% endif %}
                    </option>
                    {% endfor %}
                </select>
                <div class="role-select-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
            </div>
        </form>
    </div>
    
    <style>
    .role-switcher {
        margin-bottom: 1.5rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid color-mix(in srgb, var(--black) 8%, transparent);
    }
    
    .role-switcher-card {
        background: var(--white);
        border: 1px solid color-mix(in srgb, var(--brand-primary) 15%, transparent);
        border-radius: 16px;
        padding: 1.25rem;
        box-shadow: 0 4px 12px color-mix(in srgb, var(--brand-primary) 8%, transparent);
        transition: all 0.3s;
    }
    
    .role-switcher-card:hover {
        box-shadow: 0 6px 20px color-mix(in srgb, var(--brand-primary) 12%, transparent);
    }
    
    .role-switcher-header {
        display: flex;
        align-items: center;
        gap: 0.625rem;
        margin-bottom: 0.875rem;
        color: var(--brand-primary);
    }
    
    .role-switcher-header svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
    }
    
    .role-switcher-label {
        font-size: 0.875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    
    .role-switcher-form {
        margin: 0;
    }
    
    .role-select-wrapper {
        position: relative;
    }
    
    .role-select {
        width: 100%;
        padding: 0.75rem 2.5rem 0.75rem 1rem;
        font-size: 0.9375rem;
        font-weight: 600;
        color: var(--brand-dark);
        background: color-mix(in srgb, var(--brand-primary) 5%, transparent);
        border: 2px solid color-mix(in srgb, var(--brand-primary) 20%, transparent);
        border-radius: 12px;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        transition: all 0.3s;
    }
    
    .role-select:hover {
        background: color-mix(in srgb, var(--brand-primary) 8%, transparent);
        border-color: color-mix(in srgb, var(--brand-primary) 30%, transparent);
    }
    
    .role-select:focus {
        outline: none;
        background: var(--white);
        border-color: var(--brand-primary);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-primary) 10%, transparent);
    }
    
    .role-select-icon {
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--brand-primary);
        pointer-events: none;
        transition: transform 0.3s;
    }
    
    .role-select-icon svg {
        width: 16px;
        height: 16px;
        display: block;
    }
    
    .role-select:focus + .role-select-icon {
        transform: translateY(-50%) rotate(180deg);
    }
    
    /* Custom option styling (limited browser support) */
    .role-select option {
        padding: 0.75rem;
        font-weight: 600;
    }
    </style>
    
    <script>
        document.getElementById('roleSelect').addEventListener('change', function() {
            const selectedRole = this.value;
            const form = document.getElementById('roleSwitchForm');
            form.action = "{{ url_for('auth.switch_role', role_name='') }}" + selectedRole;
            form.submit();
        });
    </script>
    {% endif %}
</div>
