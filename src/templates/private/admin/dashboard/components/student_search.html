{# Admin Dashboard - Student Quick Search #}
<div class="ad-card">
    <div class="ad-card-header">
        <h2 class="ad-card-title">Quick Student Search</h2>
        <p class="ad-card-subtitle">Find and access student profiles</p>
    </div>
    <div class="ad-card-body">
        <div class="ad-search-wrapper">
            <div class="ad-search-input-group">
                <svg class="ad-search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input 
                    type="text" 
                    id="quickStudentSearch" 
                    class="ad-search-input" 
                    placeholder="Search by name, email, or phone..."
                    autocomplete="off"
                >
            </div>
            <div id="quickSearchResults" class="ad-search-results" style="display: none;">
                {# Results will be populated via JavaScript #}
            </div>
            <div class="ad-search-shortcuts">
                <a href="#" class="ad-search-shortcut">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    All Students
                </a>
                <a href="#" class="ad-search-shortcut">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add New Student
                </a>
            </div>
        </div>
    </div>
</div>

<style>
.ad-search-wrapper {
    position: relative;
}

.ad-search-input-group {
    position: relative;
}

.ad-search-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: #86868B;
    pointer-events: none;
}

.ad-search-input {
    width: 100%;
    padding: 0.875rem 1rem 0.875rem 3rem;
    border: 2px solid #E5E5E7;
    border-radius: 12px;
    font-size: 1rem;
    color: #1D1D1F;
    background: #F5F5F7;
    transition: all 0.2s ease;
}

.ad-search-input:focus {
    outline: none;
    border-color: #007AFF;
    background: white;
    box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
}

.ad-search-input::placeholder {
    color: #A1A1A6;
}

.ad-search-results {
    position: absolute;
    top: calc(100% + 0.5rem);
    left: 0;
    right: 0;
    background: white;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    max-height: 320px;
    overflow-y: auto;
    z-index: 100;
}

.ad-search-result-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.875rem 1rem;
    border-bottom: 1px solid #F5F5F7;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: background 0.2s ease;
}

.ad-search-result-item:last-child {
    border-bottom: none;
}

.ad-search-result-item:hover {
    background: #F5F5F7;
}

.ad-search-result-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #007AFF, #5AC8FA);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 1rem;
    flex-shrink: 0;
}

.ad-search-result-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}

.ad-search-result-content {
    flex: 1;
    min-width: 0;
}

.ad-search-result-name {
    font-size: 0.938rem;
    font-weight: 600;
    color: #1D1D1F;
    margin-bottom: 2px;
}

.ad-search-result-meta {
    font-size: 0.813rem;
    color: #86868B;
}

.ad-search-result-badge {
    padding: 0.25rem 0.625rem;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    background: #D1F4E0;
    color: #00693E;
    flex-shrink: 0;
}

.ad-search-no-results {
    padding: 2rem 1rem;
    text-align: center;
    color: #86868B;
}

.ad-search-shortcuts {
    display: flex;
    gap: 0.75rem;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid #E5E5E7;
}

.ad-search-shortcut {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    background: #F5F5F7;
    border-radius: 10px;
    text-decoration: none;
    color: #1D1D1F;
    font-size: 0.875rem;
    font-weight: 600;
    transition: all 0.2s ease;
}

.ad-search-shortcut:hover {
    background: #E8E8ED;
    color: #007AFF;
}

.ad-search-shortcut svg {
    color: #86868B;
}
</style>

<script>
// Quick Student Search functionality
(function() {
    const searchInput = document.getElementById('quickStudentSearch');
    const resultsContainer = document.getElementById('quickSearchResults');
    let searchTimeout;
    
    if (!searchInput) return;
    
    searchInput.addEventListener('input', function() {
        const query = this.value.trim();
        
        clearTimeout(searchTimeout);
        
        if (query.length < 2) {
            resultsContainer.style.display = 'none';
            return;
        }
        
        searchTimeout = setTimeout(() => {
            performSearch(query);
        }, 300);
    });
    
    // Click outside to close results
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.ad-search-wrapper')) {
            resultsContainer.style.display = 'none';
        }
    });
    
    function performSearch(query) {
        // Make AJAX request to search endpoint
        fetch(`/api/students/search?q=${encodeURIComponent(query)}`)
            .then(response => response.json())
            .then(data => {
                displayResults(data.students || []);
            })
            .catch(error => {
                console.error('Search error:', error);
                resultsContainer.innerHTML = '<div class="ad-search-no-results">Search error. Please try again.</div>';
                resultsContainer.style.display = 'block';
            });
    }
    
    function displayResults(students) {
        if (students.length === 0) {
            resultsContainer.innerHTML = `
                <div class="ad-search-no-results">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 0.5rem; opacity: 0.3;">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <div>No students found</div>
                </div>
            `;
            resultsContainer.style.display = 'block';
            return;
        }
        
        const resultsHTML = students.map(student => {
            const initials = student.name.split(' ').map(n => n[0]).join('').toUpperCase();
            const statusBadge = student.status === 'active' 
                ? '<span class="ad-search-result-badge">Active</span>' 
                : '';
            
            return `
                <a href="/admin/students/${student.id}" class="ad-search-result-item">
                    <div class="ad-search-result-avatar">
                        ${student.avatar ? `<img src="${student.avatar}" alt="${student.name}">` : initials}
                    </div>
                    <div class="ad-search-result-content">
                        <div class="ad-search-result-name">${student.name}</div>
                        <div class="ad-search-result-meta">${student.email || student.phone || 'No contact info'}</div>
                    </div>
                    ${statusBadge}
                </a>
            `;
        }).join('');
        
        resultsContainer.innerHTML = resultsHTML;
        resultsContainer.style.display = 'block';
    }
})();
</script>
