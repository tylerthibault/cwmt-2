<!-- Stats Cards Component -->
<div class="stats-grid-1">

        <div class="stat-value-1">1,234</div>
        <div class="stat-change-1 positive">
            <span>↑ 12%</span>
            <span class="stat-period-1">vs last month</span>
        </div>

                <linearGradient id="gradient-blue" x1="0%" y1="0%" x2="0%" y2="100%">

                    <stop offset="100%" style="stop-color:#007AFF;stop-opacity:0" />
                </linearGradient>
            </defs>
        </svg>
    </div>
