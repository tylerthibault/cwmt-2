<!-- Course Distribution Chart Component -->
<div class="chart-card-1">
    <div class="chart-header-1">
        <h3>Course Distribution</h3>
    </div>
    <div class="chart-body-1 center">
        <div class="donut-chart-1">
            <svg viewBox="0 0 200 200">
                <!-- Donut segments -->
                <circle cx="100" cy="100" r="80" fill="none" stroke="#007AFF" stroke-width="40" stroke-dasharray="188.5 314.2" transform="rotate(-90 100 100)"/>
                <circle cx="100" cy="100" r="80" fill="none" stroke="#34C759" stroke-width="40" stroke-dasharray="125.7 376.9" stroke-dashoffset="-188.5" transform="rotate(-90 100 100)"/>
                <circle cx="100" cy="100" r="80" fill="none" stroke="#FF9500" stroke-width="40" stroke-dasharray="62.8 439.8" stroke-dashoffset="-314.2" transform="rotate(-90 100 100)"/>
                <circle cx="100" cy="100" r="80" fill="none" stroke="#AF52DE" stroke-width="40" stroke-dasharray="62.8 502.7" stroke-dashoffset="-377" transform="rotate(-90 100 100)"/>
                
                <!-- Center -->
                <circle cx="100" cy="100" r="60" fill="white"/>
                <text x="100" y="95" text-anchor="middle" font-size="24" font-weight="600" fill="#1D1D1F">48</text>
                <text x="100" y="110" text-anchor="middle" font-size="12" fill="#86868B">Courses</text>
            </svg>
        </div>
        <div class="donut-legend-1">
            <div class="legend-item-1">
                <span class="legend-color-1" style="background: #007AFF;"></span>
                <span class="legend-label-1">Technology (30%)</span>
            </div>
            <div class="legend-item-1">
                <span class="legend-color-1" style="background: #34C759;"></span>
                <span class="legend-label-1">Business (25%)</span>
            </div>
            <div class="legend-item-1">
                <span class="legend-color-1" style="background: #FF9500;"></span>
                <span class="legend-label-1">Arts (12.5%)</span>
            </div>
            <div class="legend-item-1">
                <span class="legend-color-1" style="background: #AF52DE;"></span>
                <span class="legend-label-1">Science (12.5%)</span>
            </div>
        </div>
    </div>
</div>
