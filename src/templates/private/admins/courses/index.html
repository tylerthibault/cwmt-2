{% extends 'bases/nonstudents.html' %}

{% block sidenav %}
    {% include 'private/admins/components/navbar.html' %}
{% endblock sidenav %}

{% block inner_content %}
<div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Manage Courses</h1>
    </div>

    <div>
        {% include 'components/calendar.html' %}
    </div>
</div>

<!-- Load Modal System -->
<script src="{{ url_for('static', filename='js/modal.js') }}"></script>

<!-- Load Calendar Scripts -->
<script src="{{ url_for('static', filename='js/components/calendar/calendar-core.js') }}"></script>
<script src="{{ url_for('static', filename='js/components/calendar/calendar-admin.js') }}"></script>

<!-- Initialize Admin Calendar -->
<script>
    // Events data is already set by the calendar component template
    // Just initialize the AdminCalendar
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Initializing AdminCalendar with events:', window.calendarEvents);
        console.log('Course templates:', {{ course_templates_json | safe }});
        console.log('Instructors:', {{ instructors_json | safe }});
        
        window.adminCalendar = new AdminCalendar({
            events: window.calendarEvents || [],
            role: 'admin',
            courseTemplates: {{ course_templates_json | safe }},
            instructors: {{ instructors_json | safe }},
            locations: {{ locations_json | safe }}
        });
    });
</script>
{% endblock inner_content %}
