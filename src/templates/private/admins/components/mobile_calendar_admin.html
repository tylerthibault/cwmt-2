<!-- Admin Mobile Calendar - Full course management capabilities -->
<style>
    .mobile-calendar-container {
        max-width: 100%;
        margin: 0 auto;
        padding: 10px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .calendar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 10px;
        background: var(--primary-gradient);
        border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        color: white;
        margin-bottom: 2px;
    }

    .calendar-header h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
    }

    .calendar-nav-btn {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
    }

    .calendar-nav-btn:active {
        background: rgba(255, 255, 255, 0.3);
    }

    .calendar-weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        background: var(--gray-100);
        padding: 8px 5px;
        gap: 2px;
    }

    .calendar-weekday {
        text-align: center;
        font-size: 11px;
        font-weight: 600;
        color: var(--gray-600);
        text-transform: uppercase;
        padding: 5px 0;
    }

    .calendar-days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
        background: var(--gray-100);
        padding: 5px;
        border-radius: 0 0 var(--radius-xl) var(--radius-xl);
        min-height: 280px;
    }

    .calendar-day {
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        background: white;
        border-radius: var(--radius-md);
        font-size: 14px;
        font-weight: 500;
        color: var(--text-color);
        cursor: pointer;
        transition: all var(--transition-base);
        position: relative;
        min-height: 42px;
        padding: 4px;
        overflow: hidden;
    }

    .calendar-day:active {
        transform: scale(0.95);
        background: var(--gray-200);
    }

    .calendar-day.other-month {
        color: var(--gray-400);
        background: var(--gray-50);
    }

    .calendar-day.today {
        background: var(--primary-gradient);
        color: white;
        font-weight: 700;
        box-shadow: var(--shadow-primary);
    }

    .day-number {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 2px;
        z-index: 2;
    }

    .calendar-day.today .day-number {
        color: white;
    }

    .calendar-event-dot {
        width: 100%;
        height: 3px;
        border-radius: 2px;
        margin: 1px 0;
    }

    .calendar-event-dot.status-scheduled { background: var(--info-color); }
    .calendar-event-dot.status-completed { background: var(--success-color); }
    .calendar-event-dot.status-cancelled { background: var(--danger-color); }
    .calendar-event-dot.status-active { background: var(--warning-color); }

    .calendar-footer {
        display: flex;
        gap: 8px;
        justify-content: center;
        padding: 12px 10px;
    }

    .today-btn, .add-course-btn {
        border: none;
        padding: 10px 20px;
        border-radius: var(--radius-full);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition-base);
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .today-btn {
        background: var(--gray-200);
        color: var(--text-color);
    }

    .today-btn:active {
        background: var(--gray-300);
    }

    .add-course-btn {
        background: var(--success-color);
        color: white;
    }

    .add-course-btn:active {
        background: var(--success-color-hover);
    }

    /* Wizard Styles */
    .wizard-steps {
        display: flex;
        justify-content: space-between;
        margin-bottom: 24px;
        position: relative;
        padding: 0 20px;
    }

    .wizard-step {
        flex: 1;
        text-align: center;
        position: relative;
        z-index: 1;
    }

    .wizard-step::before {
        content: '';
        position: absolute;
        top: 20px;
        left: 0;
        right: 0;
        height: 2px;
        background-color: var(--gray-200);
        z-index: -1;
    }

    .wizard-step:first-child::before { left: 50%; }
    .wizard-step:last-child::before { right: 50%; }

    .wizard-step-number {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-full);
        background-color: var(--gray-200);
        color: var(--gray-600);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        margin-bottom: 8px;
        transition: all var(--transition-base);
    }

    .wizard-step.active .wizard-step-number {
        background: var(--primary-gradient);
        color: white;
        box-shadow: var(--shadow-primary);
    }

    .wizard-step.completed .wizard-step-number {
        background-color: var(--success-color);
        color: white;
    }

    .wizard-step-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--gray-600);
    }

    .wizard-step.active .wizard-step-label { color: var(--primary-color); }
    .wizard-step.completed .wizard-step-label { color: var(--success-color); }

    .wizard-content {
        min-height: 300px;
        padding: 0 4px;
    }

    .wizard-form-section {
        display: none;
    }

    .wizard-form-section.active {
        display: block;
        animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .course-form-group {
        margin-bottom: 16px;
    }

    .course-form-label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 6px;
        color: var(--text-color);
    }

    .course-form-input,
    .course-form-select,
    .course-form-textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--gray-300);
        border-radius: var(--radius-md);
        font-size: 14px;
        transition: border-color var(--transition-base);
    }

    .course-form-input:focus,
    .course-form-select:focus,
    .course-form-textarea:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px var(--primary-color-lighter);
    }

    .course-form-required {
        color: var(--danger-color);
    }

    .course-form-footer {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 20px;
    }

    .course-form-btn {
        padding: 10px 20px;
        border: none;
        border-radius: var(--radius-md);
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all var(--transition-base);
    }

    .course-form-btn-cancel {
        background: var(--gray-200);
        color: var(--text-color);
    }

    .course-form-btn-cancel:active {
        background: var(--gray-300);
    }

    .course-form-btn-submit {
        background: var(--primary-gradient);
        color: white;
    }

    .course-form-btn-submit:active {
        opacity: 0.9;
    }

    /* Modal Styles */
    .event-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1050;
        padding: 20px;
    }

    .event-modal {
        background: white;
        border-radius: 12px;
        max-width: 500px;
        width: 100%;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .event-modal-header {
        padding: 20px;
        border-bottom: 1px solid var(--gray-200);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .event-modal-header h3 {
        margin: 0;
        font-size: 20px;
    }

    .event-modal-close {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: var(--gray-600);
        padding: 0;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-full);
        transition: background var(--transition-base);
    }

    .event-modal-close:hover {
        background: var(--gray-100);
    }

    .event-modal-body {
        padding: 20px;
    }

    .event-status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: var(--radius-lg);
        font-size: 12px;
        font-weight: 600;
    }

    .event-status-badge.status-scheduled {
        background: var(--info-color-light);
        color: var(--info-color-hover);
    }

    .event-status-badge.status-active {
        background: var(--warning-color-light);
        color: var(--warning-color-hover);
    }

    .event-status-badge.status-completed {
        background: var(--success-color-light);
        color: var(--success-color-hover);
    }

    .event-status-badge.status-cancelled {
        background: var(--danger-color-light);
        color: var(--danger-color-hover);
    }

    @media (max-width: 375px) {
        .calendar-day {
            font-size: 12px;
            min-height: 38px;
            padding: 3px;
        }
        
        .day-number {
            font-size: 11px;
        }
        
        .calendar-header h2 {
            font-size: 16px;
        }
        
        .calendar-weekday {
            font-size: 10px;
        }

        .calendar-event-dot {
            height: 2px;
        }
    }
</style>

<div class="mobile-calendar-container">
    <div class="calendar-header">
        <button class="calendar-nav-btn" onclick="previousMonth()" aria-label="Previous month">‹</button>
        <h2 id="currentMonth">January 2026</h2>
        <button class="calendar-nav-btn" onclick="nextMonth()" aria-label="Next month">›</button>
    </div>
    
    <div class="calendar-weekdays">
        <div class="calendar-weekday">Sun</div>
        <div class="calendar-weekday">Mon</div>
        <div class="calendar-weekday">Tue</div>
        <div class="calendar-weekday">Wed</div>
        <div class="calendar-weekday">Thu</div>
        <div class="calendar-weekday">Fri</div>
        <div class="calendar-weekday">Sat</div>
    </div>
    
    <div class="calendar-days" id="calendarDays">
        <!-- Days generated by JavaScript -->
    </div>
    
    <div class="calendar-footer">
        <button class="today-btn" onclick="goToToday()">
            <i class="bi bi-calendar-day"></i> Today
        </button>
        <button class="add-course-btn" onclick="openAddCourseModal()">
            <i class="bi bi-plus-circle"></i> Add Course
        </button>
    </div>
</div>

<script>
    let currentDate = new Date();
    const events = {% if events_json is defined %}{{ events_json|safe }}{% else %}[]{% endif %};
    
    const eventsByDate = {};
    events.forEach(event => {
        if (!event.start) return;
        const parseLocalDate = (isoString) => {
            const [year, month, day] = isoString.split('T')[0].split('-').map(Number);
            return new Date(year, month - 1, day);
        };
        
        const eventStart = parseLocalDate(event.start);
        const eventEnd = event.end ? parseLocalDate(event.end) : eventStart;
        
        let currentEventDate = new Date(eventStart);
        while (currentEventDate <= eventEnd) {
            const dateKey = formatDateKey(currentEventDate);
            if (!eventsByDate[dateKey]) eventsByDate[dateKey] = [];
            eventsByDate[dateKey].push(event);
            currentEventDate.setDate(currentEventDate.getDate() + 1);
        }
    });
    
    function formatDateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }
    
    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                          'July', 'August', 'September', 'October', 'November', 'December'];
        document.getElementById('currentMonth').textContent = `${monthNames[month]} ${year}`;
        
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrevMonth = new Date(year, month, 0).getDate();
        
        const calendarDays = document.getElementById('calendarDays');
        calendarDays.innerHTML = '';
        
        const today = new Date();
        const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
        
        // Previous month days
        for (let i = firstDay - 1; i >= 0; i--) {
            const day = daysInPrevMonth - i;
            const date = new Date(year, month - 1, day);
            const dayElement = createDayElement(day, date, 'other-month');
            calendarDays.appendChild(dayElement);
        }
        
        // Current month days
        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(year, month, day);
            let classes = '';
            if (isCurrentMonth && day === today.getDate()) classes += 'today ';
            const dayElement = createDayElement(day, date, classes.trim());
            calendarDays.appendChild(dayElement);
        }
        
        // Next month days
        const totalCells = calendarDays.children.length;
        const remainingCells = 42 - totalCells;
        for (let day = 1; day <= remainingCells; day++) {
            const date = new Date(year, month + 1, day);
            const dayElement = createDayElement(day, date, 'other-month');
            calendarDays.appendChild(dayElement);
        }
    }
    
    function createDayElement(day, date, classes) {
        const dayElement = document.createElement('div');
        dayElement.className = `calendar-day ${classes}`;
        
        const dayNumber = document.createElement('div');
        dayNumber.className = 'day-number';
        dayNumber.textContent = day;
        dayElement.appendChild(dayNumber);
        
        const dateKey = formatDateKey(date);
        const dayEvents = eventsByDate[dateKey];
        
        if (dayEvents && dayEvents.length > 0) {
            const eventsToShow = dayEvents.slice(0, 3);
            eventsToShow.forEach(event => {
                const eventDot = document.createElement('div');
                eventDot.className = `calendar-event-dot status-${event.status || 'scheduled'}`;
                dayElement.appendChild(eventDot);
            });
            
            dayElement.onclick = (e) => {
                e.stopPropagation();
                showDayEvents(date, dayEvents);
            };
        } else if (!classes.includes('other-month')) {
            dayElement.onclick = (e) => {
                e.stopPropagation();
                openAddCourseModal(date);
            };
        }
        
        return dayElement;
    }
    
    function showDayEvents(date, dayEvents) {
        const dateStr = date.toLocaleDateString('en-US', { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        });
        
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const eventDate = new Date(date);
        eventDate.setHours(0, 0, 0, 0);
        const isFuture = eventDate >= today;
        
        let eventsList = '';
        dayEvents.forEach(event => {
            const statusClass = event.status || 'scheduled';
            const isEnrolled = event.is_enrolled === true;
            const canEnroll = isFuture && !isEnrolled && (statusClass === 'scheduled' || statusClass === 'active');
            
            console.log('Event Debug:', {
                title: event.title,
                isFuture: isFuture,
                isEnrolled: isEnrolled,
                status: statusClass,
                canEnroll: canEnroll,
                eventId: event.id
            });
            
            eventsList += `
                <div style="border-left: 4px solid ${getStatusColor(statusClass)}; padding: 12px; margin-bottom: 12px; background: #f8f9fa; border-radius: 4px;">
                    <div style="font-weight: 600; margin-bottom: 8px;">${event.title || 'Untitled Event'}</div>
                    ${event.location ? `<div style="font-size: 14px; color: #6c757d; margin-bottom: 4px;"><i class="bi bi-geo-alt"></i> ${event.location}</div>` : ''}
                    ${event.instructor ? `<div style="font-size: 14px; color: #6c757d; margin-bottom: 4px;"><i class="bi bi-person"></i> ${event.instructor}</div>` : ''}
                    ${event.enrollment !== undefined ? `<div style="font-size: 14px; color: #6c757d; margin-bottom: 4px;"><i class="bi bi-people"></i> ${event.enrollment}/${event.max_students || '?'} enrolled</div>` : ''}
                    <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                        <span class="event-status-badge status-${statusClass}">${statusClass.charAt(0).toUpperCase() + statusClass.slice(1)}</span>
                        ${isEnrolled ? '<span class="enrollment-badge" style="background: var(--success-color); color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600;">✓ Enrolled</span>' : ''}
                    </div>
                    ${event.id ? `
                        <div style="margin-top: 8px; display: flex; gap: 8px;">
                            <a href="/courses/view/${event.id}" class="btn btn-sm btn-primary">VIEW DETAILS</a>
                            ${canEnroll ? `<a href="/courses/enroll/${event.id}" class="btn btn-sm btn-success">Sign Up</a>` : ''}
                        </div>
                    ` : ''}
                </div>
            `;
        });
        
        const modalHtml = `
            <div class="event-modal-overlay" onclick="closeEventModal(event)">
                <div class="event-modal" onclick="event.stopPropagation()">
                    <div class="event-modal-header">
                        <h3>${dateStr}</h3>
                        <button class="event-modal-close" onclick="closeEventModal()">&times;</button>
                    </div>
                    <div class="event-modal-body">
                        ${eventsList}
                    </div>
                </div>
            </div>
        `;
        
        const modalContainer = document.createElement('div');
        modalContainer.id = 'eventModalContainer';
        modalContainer.innerHTML = modalHtml;
        document.body.appendChild(modalContainer);
    }
    
    function closeEventModal(event) {
        if (!event || event.target.classList.contains('event-modal-overlay') || event.target.classList.contains('event-modal-close')) {
            const modalContainer = document.getElementById('eventModalContainer');
            if (modalContainer) modalContainer.remove();
        }
    }
    
    function getStatusColor(status) {
        const colors = {
            'scheduled': 'var(--info-color)',
            'active': 'var(--warning-color)',
            'completed': 'var(--success-color)',
            'cancelled': 'var(--danger-color)'
        };
        return colors[status] || 'var(--info-color)';
    }
    
    function previousMonth() {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    }
    
    function nextMonth() {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    }
    
    function goToToday() {
        currentDate = new Date();
        renderCalendar();
    }

    // Admin course creation
    const courseTemplates = [
        {% if course_templates %}
        {% for template in course_templates %}
        { id: {{ template.id }}, name: "{{ template.name }}", max_students: {{ template.max_students }}, duration_days: {{ template.duration_days }} },
        {% endfor %}
        {% endif %}
    ];

    const instructorList = [
        {% if instructors %}
        {% for instructor in instructors %}
        { id: {{ instructor.id }}, name: "{{ instructor.user.full_name if instructor.user else 'Unknown' }}" },
        {% endfor %}
        {% endif %}
    ];

    function openAddCourseModal(preselectedDate = null) {
        const date = preselectedDate || new Date();
        const dateStr = date.toLocaleDateString('en-US', { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        });
        const formattedDate = formatDateKey(date);

        const modalHtml = `
            <div class="event-modal-overlay" onclick="closeCourseModal(event)">
                <div class="event-modal" onclick="event.stopPropagation()" style="max-height: 90vh; overflow-y: auto;">
                    <div class="event-modal-header">
                        <h3>Schedule New Course</h3>
                        <button class="event-modal-close" onclick="closeCourseModal()">&times;</button>
                    </div>
                    <div class="event-modal-body">
                        <div class="wizard-steps">
                            <div class="wizard-step active" data-step="1">
                                <div class="wizard-step-number">1</div>
                                <div class="wizard-step-label">Course</div>
                            </div>
                            <div class="wizard-step" data-step="2">
                                <div class="wizard-step-number">2</div>
                                <div class="wizard-step-label">Details</div>
                            </div>
                            <div class="wizard-step" data-step="3">
                                <div class="wizard-step-number">3</div>
                                <div class="wizard-step-label">Review</div>
                            </div>
                        </div>

                        <div class="wizard-content">
                            <div class="wizard-form-section active" data-step="1">
                                <h5 style="margin-bottom: 8px;">Select Course Template</h5>
                                <p style="color: var(--gray-600); font-size: 14px; margin-bottom: 20px;">Scheduled for: ${dateStr}</p>
                                <input type="hidden" id="course_date" value="${formattedDate}">
                                <div class="course-form-group">
                                    <label class="course-form-label">Course Template <span class="course-form-required">*</span></label>
                                    <select class="course-form-select" id="course_template_id" required>
                                        <option value="">Select a course...</option>
                                        ${courseTemplates.map(t => `<option value="${t.id}" data-max="${t.max_students}" data-duration="${t.duration_days}">${t.name}</option>`).join('')}
                                    </select>
                                </div>
                            </div>

                            <div class="wizard-form-section" data-step="2">
                                <h5 style="margin-bottom: 20px;">Course Details</h5>
                                <div class="course-form-group">
                                    <label class="course-form-label">Start Time <span class="course-form-required">*</span></label>
                                    <input type="time" class="course-form-input" id="start_time" value="08:00" required>
                                </div>
                                <div class="course-form-group">
                                    <label class="course-form-label">Location <span class="course-form-required">*</span></label>
                                    <input type="text" class="course-form-input" id="location" placeholder="e.g., Building A, Room 101" required>
                                </div>
                                <div class="course-form-group">
                                    <label class="course-form-label">Duration (Days) <span class="course-form-required">*</span></label>
                                    <input type="number" class="course-form-input" id="duration_days" min="1" value="1" required>
                                </div>
                                <div class="course-form-group">
                                    <label class="course-form-label">Maximum Students <span class="course-form-required">*</span></label>
                                    <input type="number" class="course-form-input" id="max_students" min="1" value="10" required>
                                </div>
                                <div class="course-form-group">
                                    <label class="course-form-label">C1 Instructor</label>
                                    <select class="course-form-select" id="c1_instructor_id">
                                        <option value="">Unassigned</option>
                                        ${instructorList.map(i => `<option value="${i.id}">${i.name}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="course-form-group">
                                    <label class="course-form-label">C2 Instructor</label>
                                    <select class="course-form-select" id="c2_instructor_id">
                                        <option value="">Unassigned</option>
                                        ${instructorList.map(i => `<option value="${i.id}">${i.name}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="course-form-group">
                                    <label class="course-form-label">Notes</label>
                                    <textarea class="course-form-textarea" id="notes" rows="3" placeholder="Optional notes"></textarea>
                                </div>
                            </div>

                            <div class="wizard-form-section" data-step="3">
                                <h5 style="margin-bottom: 20px;">Review & Confirm</h5>
                                <div id="review-content" style="background: var(--primary-color-lightest); padding: 16px; border-radius: var(--radius-lg); border-left: 4px solid var(--primary-color);">
                                    <p style="margin: 0 0 8px 0;"><strong>Date:</strong> ${dateStr}</p>
                                    <div id="review-details"></div>
                                </div>
                            </div>
                        </div>

                        <div class="course-form-footer" style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--gray-200);">
                            <button type="button" class="course-form-btn course-form-btn-cancel" id="wizard-prev" style="display: none;" onclick="wizardPrevious()">Previous</button>
                            <button type="button" class="course-form-btn course-form-btn-submit" id="wizard-next" onclick="wizardNext()">Next</button>
                            <button type="button" class="course-form-btn course-form-btn-submit" id="wizard-submit" style="display: none; background: var(--success-color);" onclick="submitCourseWizard()">Schedule Course</button>
                        </div>
                    </div>
                </div>
            </div>
        `;

        const modalContainer = document.createElement('div');
        modalContainer.id = 'courseModalContainer';
        modalContainer.innerHTML = modalHtml;
        document.body.appendChild(modalContainer);

        document.getElementById('course_template_id').addEventListener('change', updateCourseDefaults);
        window.currentWizardStep = 1;
    }

    function updateCourseDefaults() {
        const select = document.getElementById('course_template_id');
        const selectedOption = select.options[select.selectedIndex];
        if (selectedOption.value) {
            document.getElementById('max_students').value = selectedOption.dataset.max;
            document.getElementById('duration_days').value = selectedOption.dataset.duration;
        }
    }

    function wizardNext() {
        if (validateWizardStep(window.currentWizardStep)) {
            window.currentWizardStep++;
            updateWizardStep();
        }
    }

    function wizardPrevious() {
        window.currentWizardStep--;
        updateWizardStep();
    }

    function validateWizardStep(step) {
        if (step === 1) {
            if (!document.getElementById('course_template_id').value) {
                alert('Please select a course template.');
                return false;
            }
        } else if (step === 2) {
            const fields = ['start_time', 'location', 'duration_days', 'max_students'];
            if (fields.some(f => !document.getElementById(f).value)) {
                alert('Please fill in all required fields.');
                return false;
            }
        }
        return true;
    }

    function updateWizardStep() {
        const modal = document.getElementById('courseModalContainer');
        if (!modal) return;

        modal.querySelectorAll('.wizard-step').forEach(step => {
            const stepNum = parseInt(step.dataset.step);
            step.classList.remove('active', 'completed');
            if (stepNum === window.currentWizardStep) step.classList.add('active');
            else if (stepNum < window.currentWizardStep) step.classList.add('completed');
        });

        modal.querySelectorAll('.wizard-form-section').forEach(section => {
            section.classList.remove('active');
            if (parseInt(section.dataset.step) === window.currentWizardStep) {
                section.classList.add('active');
            }
        });

        const nextBtn = modal.querySelector('#wizard-next');
        const prevBtn = modal.querySelector('#wizard-prev');
        const submitBtn = modal.querySelector('#wizard-submit');

        prevBtn.style.display = window.currentWizardStep > 1 ? 'inline-block' : 'none';

        if (window.currentWizardStep === 3) {
            nextBtn.style.display = 'none';
            submitBtn.style.display = 'inline-block';
            updateReviewContent();
        } else {
            nextBtn.style.display = 'inline-block';
            submitBtn.style.display = 'none';
            if (window.currentWizardStep === 2) updateCourseDefaults();
        }
    }

    function updateReviewContent() {
        const reviewDetails = document.getElementById('review-details');
        if (!reviewDetails) return;

        const templateSelect = document.getElementById('course_template_id');
        const templateText = templateSelect.options[templateSelect.selectedIndex].text;

        const c1Select = document.getElementById('c1_instructor_id');
        const c1Text = c1Select.value ? c1Select.options[c1Select.selectedIndex].text : 'Unassigned';

        const c2Select = document.getElementById('c2_instructor_id');
        const c2Text = c2Select.value ? c2Select.options[c2Select.selectedIndex].text : 'Unassigned';

        const notes = document.getElementById('notes').value;

        reviewDetails.innerHTML = `
            <p style="margin: 8px 0;"><strong>Course:</strong> ${templateText}</p>
            <p style="margin: 8px 0;"><strong>Time:</strong> ${document.getElementById('start_time').value}</p>
            <p style="margin: 8px 0;"><strong>Location:</strong> ${document.getElementById('location').value}</p>
            <p style="margin: 8px 0;"><strong>Duration:</strong> ${document.getElementById('duration_days').value} day(s)</p>
            <p style="margin: 8px 0;"><strong>Maximum Students:</strong> ${document.getElementById('max_students').value}</p>
            <p style="margin: 8px 0;"><strong>C1 Instructor:</strong> ${c1Text}</p>
            <p style="margin: 8px 0;"><strong>C2 Instructor:</strong> ${c2Text}</p>
            ${notes ? `<p style="margin: 8px 0;"><strong>Notes:</strong> ${notes}</p>` : ''}
        `;
    }

    function submitCourseWizard() {
        const formData = {
            course_template_id: document.getElementById('course_template_id').value,
            start_date: document.getElementById('course_date').value,
            start_time: document.getElementById('start_time').value,
            location: document.getElementById('location').value,
            duration_days: document.getElementById('duration_days').value,
            max_students: document.getElementById('max_students').value,
            c1_instructor_id: document.getElementById('c1_instructor_id').value || null,
            c2_instructor_id: document.getElementById('c2_instructor_id').value || null,
            notes: document.getElementById('notes').value || null
        };

        const submitBtn = document.getElementById('wizard-submit');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Creating...';
        submitBtn.disabled = true;

        fetch('/courses/admin/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                closeCourseModal();
                window.location.reload();
            } else {
                alert('Error: ' + (data.message || 'Failed to create course'));
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        })
        .catch(error => {
            alert('An error occurred while creating the course.');
            console.error('Error:', error);
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
        });
    }

    function closeCourseModal(event) {
        if (!event || event.target.classList.contains('event-modal-overlay') || event.target.classList.contains('event-modal-close')) {
            const modalContainer = document.getElementById('courseModalContainer');
            if (modalContainer) modalContainer.remove();
        }
    }
    
    // Initialize
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderCalendar);
    } else {
        renderCalendar();
    }
</script>
