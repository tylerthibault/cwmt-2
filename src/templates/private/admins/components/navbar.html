<script>
// Collapsible section functionality
document.querySelectorAll('.sidenav-section-btn').forEach(button => {
    button.addEventListener('click', function() {
        const section = this.parentElement;
        const submenu = section.querySelector('.sidenav-submenu');
        const arrow = this.querySelector('.section-arrow');
        
        // Toggle current section
        section.classList.toggle('open');
        
        // Animate submenu
        if (section.classList.contains('open')) {
            submenu.style.maxHeight = submenu.scrollHeight + 'px';
            arrow.style.transform = 'rotate(180deg)';
        } else {
            submenu.style.maxHeight = '0';
            arrow.style.transform = 'rotate(0deg)';
        }
    });
});

// Auto-open section with active link
document.querySelectorAll('.sidenav-btn-3ddf343b.sub').forEach(link => {
    const rawHref = link.getAttribute('href');
    // Skip placeholder links (#) — they would falsely match every page
    if (!rawHref || rawHref === '#' || rawHref.startsWith('#')) return;

    const linkPath = new URL(link.href).pathname;
    const currentPath = window.location.pathname;
    // Match exact path OR any sub-path (e.g. /admin/pages matches /admin/pages/1/edit)
    const isActive = link.classList.contains('active')
                  || currentPath === linkPath
                  || currentPath.startsWith(linkPath + '/');

    if (isActive) {
        link.classList.add('active');
        const section = link.closest('.sidenav-section');
        const submenu = section.querySelector('.sidenav-submenu');
        const arrow = section.querySelector('.section-arrow');
        section.classList.add('open');
        submenu.style.maxHeight = submenu.scrollHeight + 'px';
        arrow.style.transform = 'rotate(180deg)';
    }
});
</script>
