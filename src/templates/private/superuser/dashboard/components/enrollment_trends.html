<!-- Enrollment Trends Chart Component -->
<div class="chart-card-1 chart-large">
    <div class="chart-header-1">
        <h3>Enrollment Trends</h3>
        <div class="chart-controls-1">
            <button class="chart-period-btn-1 active">Week</button>
            <button class="chart-period-btn-1">Month</button>
            <button class="chart-period-btn-1">Year</button>
        </div>
    </div>
    <div class="chart-body-1">
        <svg class="line-chart-1" viewBox="0 0 600 250" preserveAspectRatio="none">
            <!-- Grid lines -->
            <line x1="0" y1="50" x2="600" y2="50" stroke="#E5E5E7" stroke-width="1"/>
            <line x1="0" y1="100" x2="600" y2="100" stroke="#E5E5E7" stroke-width="1"/>
            <line x1="0" y1="150" x2="600" y2="150" stroke="#E5E5E7" stroke-width="1"/>
            <line x1="0" y1="200" x2="600" y2="200" stroke="#E5E5E7" stroke-width="1"/>
            
            <!-- Data line -->
            <polyline points="0,180 100,160 200,140 300,120 400,100 500,80 600,60" fill="none" stroke="#007AFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Gradient fill -->
            <polyline points="0,250 0,180 100,160 200,140 300,120 400,100 500,80 600,60 600,250" fill="url(#chart-gradient)" opacity="0.15"/>
            
            <!-- Data points -->
            <circle cx="0" cy="180" r="4" fill="#007AFF"/>
            <circle cx="100" cy="160" r="4" fill="#007AFF"/>
            <circle cx="200" cy="140" r="4" fill="#007AFF"/>
            <circle cx="300" cy="120" r="4" fill="#007AFF"/>
            <circle cx="400" cy="100" r="4" fill="#007AFF"/>
            <circle cx="500" cy="80" r="4" fill="#007AFF"/>
            <circle cx="600" cy="60" r="4" fill="#007AFF"/>
            
            <defs>
                <linearGradient id="chart-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#007AFF;stop-opacity:0.4" />
                    <stop offset="100%" style="stop-color:#007AFF;stop-opacity:0" />
                </linearGradient>
            </defs>
        </svg>
        <div class="chart-labels-1">
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>
            <span>Sun</span>
        </div>
    </div>
</div>
