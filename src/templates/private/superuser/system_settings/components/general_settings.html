<h3 class="st-section-title">General Application Settings</h3>
<form method="POST" action="{{ url_for('superuser.system_settings') }}" class="st-form">
    <input type="hidden" name="settings_category" value="general">

    <div class="st-form-grid">
        <div class="st-form-group">
            <label for="app_name" class="st-label">Application Name</label>
            <input type="text" class="st-input" id="app_name" name="app_name"
                value="CWMT Flask Application" required>
            <small class="st-help-text">The display name for your application</small>
        </div>
        <div class="st-form-group">
            <label for="app_timezone" class="st-label">Default Timezone</label>
            <select class="st-select" id="app_timezone" name="app_timezone" required>
                <option value="UTC" selected>UTC</option>
                <option value="America/New_York">Eastern Time</option>
                <option value="America/Chicago">Central Time</option>
                <option value="America/Denver">Mountain Time</option>
                <option value="America/Los_Angeles">Pacific Time</option>
            </select>
        </div>
        <div class="st-form-group">
            <label for="max_upload_size" class="st-label">Max Upload Size (MB)</label>
            <input type="number" class="st-input" id="max_upload_size" name="max_upload_size"
                value="10" min="1" max="100" required>
            <small class="st-help-text">Maximum file upload size in megabytes</small>
        </div>
        <div class="st-form-group">
            <label for="session_timeout" class="st-label">Session Timeout (hours)</label>
            <input type="number" class="st-input" id="session_timeout" name="session_timeout"
                value="24" min="1" max="168" required>
            <small class="st-help-text">User session timeout in hours</small>
        </div>
    </div>

    <button type="submit" class="st-btn st-btn-primary">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="margin-right: 6px;">
            <path d="M13 4L6 11L3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        Update General Settings
    </button>
</form>
